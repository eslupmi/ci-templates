name: _test_suites

on:
  workflow_call:
    inputs:
      impulse-ref:
        required: true
        type: string
      tests-ref:
        type: string
        default: develop

jobs:
  test-suites:
    strategy:
      fail-fast: false
      matrix:
        suite: [response, system, provider, browser]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_external_tests_suite.yml
    with:
      impulse-ref: ${{ inputs.impulse-ref }}
      tests-ref: ${{ inputs.tests-ref }}
      suite: ${{ matrix.suite }}
    secrets: inherit
