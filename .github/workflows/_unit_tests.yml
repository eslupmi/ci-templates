name: _unit_tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: blacksmith-4vcpu-ubuntu-2204
      python-version:
        type: string
        default: "3.12"

jobs:
  tests:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: eslupmi/impulse
      
      - name: Create config from none example
        run: |
          cp examples/impulse.none.yml impulse.yml
      
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ inputs.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements.txt -r tests.requirements.txt

      - name: Run tests
        timeout-minutes: 10
        env:
          DATA_PATH: ${{ runner.temp }}/data
        run: python -m pytest tests/ --color=yes -v
